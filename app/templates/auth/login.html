{% extends "base.html" %}

{% block title %}Sign In - DocuVault{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.5rem; box-shadow: var(--shadow-xl);">
    
    <!-- Logo & Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 52px; height: 52px; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; color: white; margin-bottom: 1rem; box-shadow: 0 8px 16px var(--primary-glow);">
        <i data-lucide="layers" style="width: 28px; height: 28px;"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em;">Welcome to DocuVault</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">Enterprise Document Management & Versioning</p>
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <div style="position: relative;">
          <input type="text" id="loginIdentifier" name="identifier" class="form-input" required autofocus style="padding-left: 2.4rem;">
          <i data-lucide="user" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <div style="position: relative;">
          <input type="password" id="loginPassword" name="password" class="form-input" required style="padding-left: 2.4rem;">
          <i data-lucide="lock" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-secondary);">
          <input type="checkbox" name="remember" value="1" checked style="accent-color: var(--primary);">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-bottom: 1rem;">
        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
        <span>Sign In</span>
      </button>
    </form>

    <!-- Footer link -->
    <div style="text-align: center; font-size: 0.88rem; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
      Don't have an account? 
      <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
