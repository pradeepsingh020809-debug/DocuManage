{% extends "base.html" %}

{% block title %}File Too Large - 413 - DocuVault{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center;">
  <div class="glass-card" style="padding: 3.5rem 2rem; max-width: 480px; width: 100%;">
    <div style="font-size: 4rem; font-weight: 800; color: var(--danger); line-height: 1; margin-bottom: 1rem;">413</div>
    <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem;">File Exceeds Max Upload Limit</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">The uploaded file exceeds the maximum allowed file size of 200MB.</p>
    <a href="{{ url_for('folders.explorer') }}" class="btn btn-primary">
      <i data-lucide="arrow-left"></i>
      <span>Back to Documents</span>
    </a>
  </div>
</div>
{% endblock %}
