{% extends "base.html" %}

{% block title %}Server Error - 500 - DocuVault{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center;">
  <div class="glass-card" style="padding: 3.5rem 2rem; max-width: 480px; width: 100%;">
    <div style="font-size: 4rem; font-weight: 800; color: var(--danger); line-height: 1; margin-bottom: 1rem;">500</div>
    <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem;">Internal Server Error</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Something went wrong while processing your request. Please try again later.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
      <i data-lucide="home"></i>
      <span>Return to Dashboard</span>
    </a>
  </div>
</div>
{% endblock %}
